<!DOCTYPE html>
<html lang="en" data-theme="dark">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Quantum Coin — Moon Mining</title>
    <link rel="stylesheet" href="/static/styles.css" />
</head>

<body>
    <div id="hud">
        <div class="brand">🚀 Quantum Coin</div>

        <div class="stat"><span>QC</span><b id="qc">0.000</b></div>
        <div class="stat"><span>TGWT</span><b id="tgwt">0</b></div>

        <div class="stat"><span>Energy</span><b id="energy">100/100</b></div>
        <div class="energy-bar">
            <div class="energy-fill" id="energyFill"></div>
        </div>

        <div class="stat"><span>Level</span><b id="level">1</b></div>
        <div class="stat"><span>Ship</span><b id="ship">-</b></div>

        <div class="sep"></div>
        <div class="stat"><span>Sector</span><b id="sector">-</b></div>
        <div class="stat"><span>Session</span><b id="session">-</b></div>
    </div>

    <!-- 2D fallback canvas (CSS ile görünmez yapıyoruz) -->
    <canvas id="game"></canvas>

    <!-- 3D sahne kökü -->
    <div id="three-root"></div>

    <div id="toolbar">
        <button id="btnMine">⛏️ Mine</button>
        <button id="btnShop">🛒 Buy Ship</button>
        <button id="btnSocial">📣 Social</button>
        <button id="btnFriends">👥 Friends</button>
        <button id="btnAd">🎬 Watch Ad</button>
        <button id="btnWallet">👛 Wallet</button>
    </div>

    <!-- Modal -->
    <div id="modal" class="hidden">
        <div class="modal">
            <div class="modal-head">
                <div id="modal-title">Title</div>
                <button id="modal-close">✖</button>
            </div>
            <div id="modal-body"></div>
        </div>
    </div>

    <!-- Three.js (lokal dosyalar) -->
    <script src="/static/three/three.min.js"></script>
    <script src="/static/three/GLTFLoader.js"></script>
    <script src="/static/three/OrbitControls.js"></script>

    <!-- 3D sahne kodu -->
    <script src="/static/scene3d.js"></script>

    <!-- Mevcut UI/oyun mantığı -->
    <script src="/static/app.js"></script>
</body>

</html>
