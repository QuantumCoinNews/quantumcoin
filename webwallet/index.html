<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>QuantumCoin Wallet</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  <!-- QC_TESTNET_LABEL_UI_V1 -->
<div id="qc-testnet-badge-v1" style="display:none;position:fixed;z-index:99999;top:10px;right:10px;background:#b91c1c;color:#fff;font-family:Arial,sans-serif;font-size:13px;font-weight:800;letter-spacing:.08em;padding:8px 12px;border-radius:10px;box-shadow:0 6px 22px rgba(0,0,0,.25);">TESTNET</div>
<script id="qc-testnet-label-ui-v1">
(function(){
  function showBadge(){
    var el=document.getElementById('qc-testnet-badge-v1');
    if(el){ el.style.display='block'; }
    document.documentElement.setAttribute('data-qc-network','testnet');
    document.title = document.title.indexOf('TESTNET') >= 0 ? document.title : 'TESTNET - ' + document.title;
  }
  fetch('/api/network/label',{cache:'no-store'})
    .then(function(r){ return r.ok ? r.json() : null; })
    .then(function(j){ if(j && (j.is_testnet === true || j.label === 'TESTNET')) showBadge(); })
    .catch(function(){});
})();
</script>
</body>
</html>
